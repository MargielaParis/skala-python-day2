[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # 줄 길이는 black이 관리한다
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true      # pandas/polars/sklearn 등 스텁 없는 패키지 허용
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "^(output|data|\\.venv|venv)/"

# numpy 2.5의 동봉 스텁은 3.12 전용 `type` 문을 써서 python_version=3.11로는 파싱되지 않는다.
# 우리 코드가 아니므로 따라 들어가지 않는다.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
